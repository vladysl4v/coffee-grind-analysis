[project]
name = "coffee"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "jupyter",
    "matplotlib",
    "scikit-image",
    "tqdm",
    "pywavelets",
    "timm>=1.0.26",
    "torch",
    "torchvision",
    "scipy",
    "streamlit>=1.58.0",
]

# ONLY PyTorch index defined (no global override)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }